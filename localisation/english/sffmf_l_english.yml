  COMINTERN_bomber_command:0 "Bomber Command"
  COMINTERN_bomber_command_desc:0 "Establishing a joint bomber command will allow us to better coordinate our ground support in the battlefield, and our bomber incursions behind enemy lines."
  COMINTERN_fighter_command:0 "Fighter Command"
  COMINTERN_fighter_command_desc:0 "The same way we share our ideals and overarching mission, we share the skies above us. We must fly together to protect each other's airspace, and gain air supremacy over the battlefield so our ties are not broken by our enemy's ground support"
  COMINTERN_ground_operations:0 "Ground Operations"
  COMINTERN_ground_operations_desc:0 "Building more bases, allows us to have more flexibility in our joint air operations, and building more anti-air batteries we can defend our land and take some weight out of our pilot's backs. This is how we create an interlinked ground support system to maximize the effectiveness of our air operations"
  COMINTERN_carrier_effort:0 "Carrier Effort"
  COMINTERN_carrier_effort_desc:0 "The new frontier of naval combat are the skies above them. We need to pool our resources into creating the best carriers, and the best carrier aircraft possible. That way we can dominate the seas, and by doing that, create the security that our countries require"
  ALLIES_command:0 "Allies Joint Army High Command"
  ALLIES_command_desc:0 "Uniting our High Commands will bring the best results and ensure any war will be won by us as quickly and smoothly as possible"
  ALLIES_political_cooperation:0 "Political Cooperation"
  ALLIES_political_cooperation_desc:0 "Lip service will not be enough to truly work together. If we really want to become a force to be reckoned with, we need all of our systems to be cogs of a larger, well oiled machine"
  ALLIES_economic_union:0 "Economic Union"
  ALLIES_economic_union_desc:0 "We must pool our resources together, we all have something our neighbor needs. By breaking the barriers that have kept our economies separate for a long time we will achieve a higher level of efficiency. The resources must flow between us so we can better help each other"
  ALLIES_shared_intelligence:0 "Shared Intelligence"
  ALLIES_shared_intelligence_desc:0 "Our whole alliance revolves around sharing our power, and if knowledge indeed equates to power, then let us share what we know about our enemies, and what we know our enemies know about us—and even what they think they know about us"
  ALLIES_procurement_fund:0 "Stabilize Currency"
  ALLIES_procurement_fund_desc:0 "Our economic cooperation will make our currency more valuable, making us richer and bringing prosperity to our nations"
  ALLIES_materiel_design:0 "Materiel Design"
  ALLIES_materiel_design_desc:0 "War has changed in many ways across generations, but for centuries now, it often boils down to a man and his rifle. In this new era of warfare we cannot neglect the weapons for our men, and by designing better weapons, we will make better soldiers"
  ALLIES_construction_developments:0 "Construction Developments"
  ALLIES_construction_developments_desc:0 "There's much to be done in our alliance, and little time before the hour of doom comes. We will have to work together to find the improvements we need to get up to speed in the development of our nations"
  ALLIES_industry:0 "Industrial Development"
  ALLIES_industry_desc:0 "With or without war, our nations must build the infrastructure and capital needed to support our civilian population and improve their quality of life. Of course, once the wartime hits, it will be a vital bedrock of our war economy"
  ALLIES_civilian_contributions:0 "Civilian Contributions"
  ALLIES_civilian_contributions_desc:0 "Now that the general population has a new sense of shared identity with the other members of our alliance, we know they will be willing to make the contributions and sacrifices needed to fuel the war machine that will bring safety and glory to our alliance"
  ALLIES_fill_the_infrastructure_gaps:0 "Fill The Infrastructure Gaps"
  ALLIES_fill_the_infrastructure_gaps_desc:0 "Before joining together, our countries were at different levels of development, and even some of the regions in the most developed countries in our alliance could use some better infrastructure. We must pull together to raise all boats"
  ALLIES_develop_resources:0 "Develop Resources"
  ALLIES_develop_resources_desc:0 "You never know what you might find if you look hard enough. If we focus our efforts we could unearth undiscovered deposits of resources crucial to the war effort, and even develop new ways to extract more out of what we already have"
  ALLIES_naval_construction:0 "Naval Construction"
  ALLIES_naval_construction_desc:0 "Having a long tradition of seafaring and world class sailors is all well and good, but it means nothing if we don't have the ships to use them against our enemies. Let us build up a grand fleet together, and use it to crush any country that threaten us"
  ALLIES_railway_expansion:0 "Railway Expansion"
  ALLIES_railway_expansion_desc:0 "Railways are the arteries of our nations, and now more than ever we need these lanes of transportation as widespread as possible. Now that we are united in objective, we must be physically united through the steel and speed of the locomotives"
  ALLIES_electronics:0 "New Electronics"
  ALLIES_electronics_desc:0 "Electronics are here, and they could become the deciding factor of warfare in the future, we cannot let our enemy beat us to the punch in the electronics arms race. Let us develop these electronics together so this new power lays on our side"
  ALLIES_research_investments:0 "Joint Research Investments"
  ALLIES_research_investments_desc:0 "Our new alliance is tighter than any other, there's no reason why we should keep our technological advancements to ourselves. Let us share our research so our tools of warfare have the edge they need to cut our enemies down"
  ALLIES_nuclear_research:0 "Nuclear Research"
  ALLIES_nuclear_research_desc:0 "Scientists cannot keep their mouths shut about the new world that is bound to land upon us when the splitting of the atom is finally weaponized. Why should we be kept from this technological miracle that could bring and end to the war in one fell swoop"
  ALLIES_nuclear_production:0 "Nuclear Production"
  ALLIES_nuclear_production_desc:0 "Now that we have the knowledge to split the atom, we may as well use it. But first, we need to produce the materials and infrastructure needed to produce enough to turn the tides of war in our favor"
  ALLIES_rocketry:0 "Rocketry"
  ALLIES_rocketry_desc:0 "What if our bombs could be delivered without the intervention of a plane? Self propelled weapons are the future, we could decimate the enemy from the comfort of our homes if we so wish"
  ALLIES_jet_engines:0 "Into The Jet Age"
  ALLIES_jet_engines_desc:0 "New advancements in jet engines make the top of the class propeller aircraft look like paper kites drifting aimlessly. The new age of aerial combat is here and will be dominated by the jet engine. If we pool our investments into the field together, we can leapfrog our enemies and produce the top of the aircraft food chain."
  ALLIES_military_industry:0 "Military Buildup"
  ALLIES_military_industry_desc:0 "The Military Buildup Program will be established to ensure that our war machine is always supplied with the cogs it needs to function, and to defend our nations from terror and win any war necessary"
  ALLIES_standarized_parts:0 "Standarized Parts"
  ALLIES_standarized_parts_desc:0 "Now that we stand as one, we can benefit from sharing our standards with each other so our factories can get up to speed as quickly as possible. Equipment and parts could become interchangeable, streamlining our production considerably"
  ALLIES_military_industry_hub:0 "Military Industry Hubs"
  ALLIES_military_industry_hub_desc:0 "By concentrating our military industries in an efficient way, we can use this proximity and specialization to achieve new heights for our war machines. We shall outproduce our enemies, as long as we keep our factories in place"
  ALLIES_ad_hoc_military_industry:0 "Ad-Hoc Military Industry"
  ALLIES_ad_hoc_military_industry_desc:0 "There is no time to plan and build monumental factory campuses, or expanses of concrete and smoke. We must build our industry as quickly as we can, wherever possible, with small factories dotted around so we don't risk losing it all in one battle"
  ALLIES_equipment_conversion_focus:0 "Efficient Equipment Conversion"
  ALLIES_equipment_conversion_focus_desc:0 "We have vast warehouses filled with old weapons and vehicles, either mothballed or captured from our fallen enemies. This old equipment can be refitted into the newest and most deadly our current war machine offers"
  ALLIES_machine_tools_research:0 "Machine Tools Research"
  ALLIES_machine_tools_research_desc:0 "Manpower is just one part of the equation. We need to outproduce our enemies so we can replace the losses that they cannot. This is why we cannot limit ourselves to developing new war machines, but focus our attention on the machinery that spawns them"
  ALLIES_army:0 "Land Operations Department"
  ALLIES_army_desc:0 "Regardless of the nation they come from, all soldiers are part of our alliance, and will march until our enemies is eradicated, by our combined strength and implacable will"
  ALLIES_joint_military_exercises:0 "Joint Military Exercises"
  ALLIES_joint_military_exercises_desc:0 "Our soldiers and officers have never encountered an alliance like the one we are now in, they must be drilled as one until working together becomes second nature. Once this happens, our forces will be unstoppabl."
  ALLIES_unified_recruitment:0 "Unified Recruitent"
  ALLIES_unified_recruitment_desc:0 "We must find a way to standardize our recruitment efforts, and streamline the process so we can get more of our men can get from the recruitment office to the front as quickly as possible"
  ALLIES_mechanized_army:0 "Mechanized Army"
  ALLIES_mechanized_army_desc:0 "If we focus our efforts in training our men to fight inside and alongside hulking vehicles clad in steel and cannons, we can pack a bigger punch with less men. As long as we can produce enough of said hulks, of course"
  ALLIES_infantry_first:0 "Infantry First"
  ALLIES_infantry_first_desc:0 "For generations our men have gone into the battlefield with just their weapons and the garments on them, to fight tooth and nail for every inch against another poor soul in front of them. If our troops can see the eyes of the enemy in front of them, they will see the threat they pose and fight until the death for their nations"
  ALLIES_navy:0 "Naval Coordination Command"
  ALLIES_navy_desc:0 "The combined navies of the alliance will rule the waves across all our dominions. We will be a tide that will pound our enemies until all that's left is their shipwrecks"
  ALLIES_naval_exercises:0 "Naval Exercises"
  ALLIES_naval_exercises_desc:0 "As any seafaring nations knows, the sea can be both a moat and a highway at the same time. Let us learn how to defend and attack from the sea"
  ALLIES_naval_officer_academy:0 "Naval Officer Academy"
  ALLIES_naval_officer_academy_desc:0 "A good officer matters in naval warfare more than in most other forms of combat. There's not much than a single sailor can do without coordination from the hierarchy of officers that staff the ships and taskforces of our navies. Investing in training these men for making difficult choices and working together is of the utmost importance"
  ALLIES_construct_new_dockyards:0 "Construct New Dockyards"
  ALLIES_construct_new_dockyards_desc:0 "Our goal of having the biggest navy is slowed down by our amount of dockyards. We need more of them if we want our combined navy to dominate all seas"
  ALLIES_naval_research_institute:0 "Naval Research Institute"
  ALLIES_naval_research_institute_desc:0 "It will not be enough for us to catch up to our enemies, we need to be at the forefront of Naval technology, like we've been before. Let's embrace our region's legacy of exploration and naval dominance"
  ALLIES_submarine_cooperation:0 "Submarine Cooperation"
  ALLIES_submarine_cooperation_desc:0 "By denying the enemy the ability to transport troops and supply by the sea, we have already half won the war. The best way to ensure this is to work jointly on producing state of the art submarines"
  ALLIES_mountaineers:0 "Mountain Specialists"
  ALLIES_mountaineers_desc:0 "With a strong cadre of mountain specialists, we should be able to defend the region much more easily, and make it possible to counterattack whenever we have the chance. Even if part of our territory falls into enemy hands, we shall never surrender"
  ALLIES_amphibious_forces:0 "Amphibious Forces"
  ALLIES_amphibious_forces_desc:0 "By ensuring that we can strike our enemies anywhere, anytime, we can reduce their offensive capabilities. If they always have to fear a landing, anywhere along their coastline, they can't deploy as much units on the front line. Thus our focus need to be on amphibious operations and marines"
  ALLIES_airforce:0 "Air Defense Program"
  ALLIES_airforce_desc:0 "If we develop our aerial capabilities, we will better direct our strength. We will make our foes bow down before the might of our combined air forces"
  ALLIES_air_exercises:0 "Air Exercises"
  ALLIES_air_exercises_desc:0 "As air combat brought a new era of war, this new era of cooperation between our nations must be accompanied by tightly executed joint aerial operations. For that, our forces need drill together until they fly as one"
  ALLIES_air_production:0 "Air Production"
  ALLIES_air_production_desc:0 "If we hope to establish supremacy across the world, we need to produce as much aircrafts as possible. Thankfully, we can share the practices, knowledge and equipment we can use to outproduce the enemy and get closer to our goals"
  ALLIES_naval_aircraft:0 "Naval Aircraft"
  ALLIES_naval_aircraft_desc:0 "The future of sea warfare lies in the skies. Our naval bombers will send the ships of our enemies to the bottom of the sea, and from our carriers fighters swarms of fighters will cover the skies with the smoke of our enemy's aircraft"
  ALLIES_bomber_command:0 "Bomber Command"
  ALLIES_bomber_command_desc:0 "Establishing a joint bomber command will allow us to better coordinate our ground support in the battlefield, and our bomber incursions behind enemy lines."
  ALLIES_fighter_command:0 "Fighter Command"
  ALLIES_fighter_command_desc:0 "The same way we share our ideals and overarching mission, we share the skies above us. We must fly together to protect each other's airspace, and gain air supremacy over the battlefield so our ties are not broken by our enemy's ground support"
  ALLIES_ground_operations:0 "Ground Operations"
  ALLIES_ground_operations_desc:0 "Building more bases, allows us to have more flexibility in our joint air operations, and building more anti-air batteries we can defend our land and take some weight out of our pilot's backs. This is how we create an interlinked ground support system to maximize the effectiveness of our air operations"
  ALLIES_carrier_effort:0 "Carrier Effort"
  ALLIES_carrier_effort_desc:0 "The new frontier of naval combat are the skies above them. We need to pool our resources into creating the best carriers, and the best carrier aircraft possible. That way we can dominate the seas, and by doing that, create the security that our countries require"

  army_effort_sffmf:0 "Army Effort"
  army_effort_sffmf_desc:0 "Despite the increasing possibilities of aerial and naval warfare, ground combat is still key in tomorrow's wars. With preparation, we can avoid reliving the hell of the trenches."
  equipment_effort_sffmf:0 "Equipment Effort"
  equipment_effort_sffmf_desc:0 "The limits for what equipment can be carried by infantry are constantly being pushed. We will focus on giving our troops the best tools available."
  motorization_effort_sffmf:0 "Motorization Effort"
  motorization_effort_sffmf_desc:0 "Mobility and protection are crucial to get infantry into and out of the field safely. Focusing on these developments will allow us to take action quickly."
  doctrine_effort_sffmf:0 "Doctrine Effort"
  doctrine_effort_sffmf_desc:0 "The military doctrines that defined ground combat in the Great War are outdated. We must put our greatest minds to the task of shaping the military thought of tomorrow."
  equipment_effort_2_sffmf:0 "Equipment Effort II"
  equipment_effort_2_sffmf_desc:0 "We will continue our efforts to ensure our infantry and support troops are armed with the best possible equipment of our time."
  mechanization_effort_sffmf:0 "Mechanization Effort"
  mechanization_effort_sffmf_desc:0 "Rethinking the possibilities of motorized infantry, we can push the limits of what vehicles can be constructed today."
  doctrine_effort_2_sffmf:0 "Doctrine Effort II"
  doctrine_effort_2_sffmf_desc:0 "The battlefield has changed not just in the interbellum years, but over the course of recent conflicts. We must continuously reevaluate our doctrines to reflect this."
  equipment_effort_3_sffmf:0 "Equipment Effort III"
  equipment_effort_3_sffmf_desc:0 "Instead of imitating or buying foreign equipment, we should aim to become world-leading in infantry weapons."
  armor_effort_sffmf:0 "Armor Effort"
  armor_effort_desc_sffmf:0 "Applying what we have learned from mechanizing our infantry, we can improve our armored vehicles as well."
  special_forces_sffmf:0 "Special Forces"
  special_forces_sffmf_desc:0 "We have need of elite forces; mountain troops and paratroopers should be our priority."
  aviation_effort_sffmf:0 "Aviation Effort"
  aviation_effort_sffmf_desc:0 "Nowhere is technological advances more rapid than in aerial warfare. Aviation is a field any modern nation must master."
  fighter_focus_sffmf:0 "Fighter Focus"
  fighter_focus_sffmf_desc:0 "We have not seen that last of dogfights in the Great War. Keeping ahead in the development of fighter planes will give us an edge in the future."
  bomber_focus_sffmf:0 "Bomber Focus"
  bomber_focus_sffmf_desc:0 "When people of the future speak of the horror to today's wars, fire raining from the skies will prominently feature. We will do our best to ensure those stories are told by our enemies."
  aviation_effort_2_sffmf:0 "Aviation Effort II"
  aviation_effort_2_sffmf_desc:0 "Further advances in aviation will be necessary to integrate our air force well with other branches of the military."
  CAS_effort_sffmf:0 "CAS Effort"
  CAS_effort_sffmf_desc:0 "A modern army needs support from vehicles not only on the ground, but also in the air."
  rocket_effort_sffmf:0 "Rocket Effort"
  rocket_effort_sffmf_desc:0 "Rocket and jet engines allow for unprecedented speeds for unmanned and manned vessels alike. Pioneering these technologies will allow us to take the enemy by surprise."
  NAV_effort_sffmf:0 "NAV Effort"
  NAV_effort_sffmf_desc:0 "Just as the new naval warfare takes place in part beneath the water's surface, part of it takes place in the air above the waters."
  naval_effort_sffmf:0 "Naval Effort"
  naval_effort_sffmf_desc:0 "The expansion of our navy should be our first priority. Assign all available resources to new Dockyards and research into light surface ships."
  flexible_navy_sffmf:0 "Flexible Navy"
  flexible_navy_sffmf_desc:0 "Reinventing naval warfare to account for the advances in submarine technology will allow us to strike efficiently against enemy convoys."
  large_navy_sffmf:0 "Large Navy"
  large_navy_sffmf_desc:0 "Adapting our naval doctrines to accommodate large ships and ensuring the safety of our trade convoys will teach us much about what sort of ships we need."
  submarine_effort_sffmf:0 "Submarine Effort"
  submarine_effort_sffmf_desc:0 "Submarine warfare is the most exciting naval development since the invention of the torpedo boat. We would do well to not just protect against submarines, but also use them against enemy shipping."
  cruiser_effort_sffmf:0 "Cruiser Effort"
  cruiser_effort_sffmf_desc:0 "Before making forays into advanced battleship research, the smaller cruisers are in need of replacement."
  destroyer_effort_sffmf:0 "Destroyer Effort"
  destroyer_effort_sffmf_desc:0 "Studying the design and strategic use of submarines, we have also learned how to counter those strategies. Destroyers will be crucial for this."
  capital_ships_effort_sffmf:0 "Capital Ship Effort"
  capital_ships_effort_sffmf_desc:0 "The nation with the most battleships will rule the oceans. Battleships and carriers represent the old and the new in naval superiority."
  industrial_effort_sffmf:0 "Industrial Effort"
  industrial_effort_sffmf_desc:0 "Focus all our political efforts on building up the civilian industry in a great leap forward."
  industrial_effort_2_sffmf:0 "Industrial Effort II"
  industrial_effort_2_sffmf_desc:0 "With iron will and a relentless work ethic, we can mobilize the people in another great industrial effort."
  construction_effort_sffmf:0 "Construction Effort"
  construction_effort_sffmf_desc:0 "Civilian industrial capacity must not be underestimated even when war looms over the world."
  production_effort_sffmf:0 "Armament Effort"
  production_effort_sffmf_desc:0 "If you can build tractors, you can build tanks! We must not allow our military production capacity to lag behind."
  construction_effort_2_sffmf:0 "Construction Effort II"
  construction_effort_2_sffmf_desc:0 "Continuing to expand our factories will allow us to speed up production of goods for trade and further construction efforts."
  production_effort_2_sffmf:0 "Armament Effort II"
  production_effort_2_sffmf_desc:0 "Trying to adapt civilian factories to produce military equipment is inefficient. We should focus on preparing military production now."
  production_effort_3_sffmf:0 "Armament Effort III"
  production_effort_3_sffmf_desc:0 "Continued efforts to expand our military factories are necessary to meet the demands for new equipment."
  infrastructure_effort_sffmf:0 "Infrastructure Effort"
  infrastructure_effort_sffmf_desc:0 "A country without proper infrastructure cannot pursue advanced projects or constructions."
  infrastructure_effort_2_sffmf:0 "Infrastructure Effort II"
  infrastructure_effort_2_sffmf_desc:0 "Extending our infrastructure further will enable the transports and communications necessary for high-tech clandestine projects."
  construction_effort_3_sffmf:0 "Construction Effort III"
  construction_effort_3_sffmf_desc:0 "Expansion of our infrastructure network has significantly improved our capacity for construction."
  nuclear_effort_sffmf:0 "Nuclear Effort"
  nuclear_effort_sffmf_desc:0 "Standing on the edge of a world-changing discovery, we cannot let others light the fire that may one day consume the Earth."
  extra_tech_slot_sffmf:0 "Extra Research Slot"
  extra_tech_slot_sffmf_desc:0 "Our industrial expansion and other recent advances might allow us to conduct more R&D in parallel."
  extra_tech_slot_2_sffmf:0 "Extra Research Slot II"
  extra_tech_slot_sffmf_2_desc:0 "The rapid industrialization of our nation has opened up new opportunities in R&D that we should pursue."
  technology_sharing_sffmf:0 "Technology Sharing"
  technology_sharing_sffmf_desc:0 "By sharing technological advances with our allies, our whole faction will be able to conduct wartime R&D more efficiently."
  secret_weapons_sffmf:0 "Secret Weapons"
  secret_weapons_sffmf_desc:0 "It is tempting to expend all extra resources into developing tanks and planes, but the secret to winning wars lies in whole new fields of science; electronics, rocketry and nuclear research."
  political_effort_sffmf:0 "Political Effort"
  political_effort_sffmf_desc:0 "To bring about change in the world, we need to be able to bring about change in our own country. Strengthening our political position should come first."
  collectivist_ethos_sffmf:0 "Collectivist Ethos"
  collectivist_ethos_sffmf_desc:0 "Our enemies may divide and conquer lesser nations, but our people will stand united. All for one and one for all."
  liberty_ethos_sffmf:0 "Liberty Ethos"
  liberty_ethos_sffmf_desc:0 "In this time of ideological fanatics who seek to suffocate the human spirit, we will safeguard individual liberties and freedom."
  militarism_sffmf:0 "Militarism"
  militarism_sffmf_desc:0 "Those who view the military as a necessary evil are doomed to hesitate in the face of war. We will ingrain militarism into our culture to become a people of soldiers."
  political_correctness_sffmf:0 "Political Correctness"
  political_correctness_sffmf_desc:0 "People holding mildly controversial or otherwise embarrassing opinions appear to be concerned that there is a wide-reaching conspiracy against them. This seems like an excellent idea."
  neutrality_focus_sffmf:0 "Neutrality Focus"
  neutrality_focus_sffmf_desc:0 "While others may claim it takes bravery and wisdom to take sides in a global conflict, we know it takes more to refuse."
  interventionism_focus_sffmf:0 "Interventionism Focus"
  interventionism_focus_sffmf_desc:0 "We value the freedom of all people, not only our own citizens. If preventing tyranny means war, then so be it."
  military_youth_sffmf:0 "Military Youth"
  military_youth_sffmf_desc:0 "Organizations to promote discipline and political education of young people in our nation will foster loyalty and self-sacrifice early."
  deterrence_sffmf:0 "Deterrence"
  deterrence_sffmf_desc:0 "Standing alone, we rarely benefit from war. Fortunately, we know that the best defense is one so well-known you never have to put it to use."
  volunteer_corps_sffmf:0 "Volunteer Corps"
  volunteer_corps_sffmf_desc:0 "Forcing our people to die for ideals of freedom would be an exercise in irony, but establishing means for those who wish to aid people abroad is not."
  paramilitarism_sffmf:0 "Paramilitarism"
  paramilitarism_sffmf_desc:0 "Military principles have applications outside of the military. With the development of semi-militarized units to complement our armed forces, more people will have military training."
  indoctrination_focus_sffmf:0 "Indoctrination"
  indoctrination_focus_sffmf_desc:0 "Having established our ideology as based on the truth, it may be taught as truth. Education and media must reflect this lesson."
  foreign_expeditions_sffmf:0 "Foreign Expeditions"
  foreign_expeditions_sffmf_desc:0 "With our enemies prepared to intervene in distant conflicts on behalf of their ideals, we must be ready to do the same for ours."
  why_we_fight_sffmf:0 "Why We Fight"
  why_we_fight_sffmf_desc:0 "The world is growing increasingly unsafe. Our people need to see the atrocities being committed by those who crave power. It is time we rally the people to our cause and ensure everyone is ready to fight for our freedom."
  political_commissars_sffmf:0 "Political Commissars"
  political_commissars_sffmf_desc:0 "To ensure that our policies are followed in military practice, we will introduce politically appointed officials into military ranks."
  internationalism_focus_sffmf:0 "Internationalism Focus"
  internationalism_focus_sffmf_desc:0 "Ideology knows no borders. Another nation may call itself sovereign, but our convictions are above such claims."
  nationalism_focus_sffmf:0 "Nationalism Focus"
  nationalism_focus_sffmf_desc:0 "Our nation is unique, and our political achievements could only have happened here. We must fight for it at any cost."
  ideological_fanaticism_sffmf:0 "Ideological Fanaticism"
  ideological_fanaticism_sffmf_desc:0 "Our politically established values and goals are worth dying for as much as any ancient faith. Any follower should be prepared to face death, and those who stray better be prepared to face death."

