  COMINTERN_command_desc:0 "Uniting our High Commands will bring the best results and ensure any war will be won by us as quickly and smoothly as possible"
  ALLIES_create_allies_command:0 "Create Joint Allies Command"
  ALLIES_create_allies_command_desc:0 "To unite whole Europe under our command we need closer cooperation with those who share our worldview"
  ALLIES_first_joint_institution:0 "Allies War Research Institute"
  ALLIES_first_joint_institution_desc:0 "Closer cooperation with our allies will bring a breakthrough in new war technology"
  ALLIES_second_institution:0 "Allies War Production Committee"
  ALLIES_second_institution_desc:0 "As war time is closing upon us, we need our countries to cooperate in production of new war equipment"
  ALLIES_research:0 "Allies Joint Research Group"
  ALLIES_research_desc:0 "Our joint research group will be developing the latest means of destruction, and mass produce the best tools we can so that win all wars and become masters of Europe"

  AXIS_political_cooperation:0 "Political Cooperation"
  AXIS_political_cooperation_desc:0 "Lip service will not be enough to truly work together. If we really want to become a force to be reckoned with, we need all of our systems to be cogs of a larger, well oiled machine"
  AXIS_economic_union:0 "Economic Union"
  AXIS_economic_union_desc:0 "We must pool our resources together, we all have something our neighbor needs. By breaking the barriers that have kept our economies separate for a long time we will achieve a higher level of efficiency. The resources must flow between us so we can better help each other"
  AXIS_shared_intelligence:0 "Shared Intelligence"
  AXIS_shared_intelligence_desc:0 "Our whole alliance revolves around sharing our power, and if knowledge indeed equates to power, then let us share what we know about our enemies, and what we know our enemies know about us—and even what they think they know about us"
  AXIS_procurement_fund:0 "Stabilize Currency"
  AXIS_procurement_fund_desc:0 "Our economic cooperation will make our currency more valuable, making us richer and bringing prosperity to our nations"
  AXIS_materiel_design:0 "Materiel Design"
  AXIS_materiel_design_desc:0 "War has changed in many ways across generations, but for centuries now, it often boils down to a man and his rifle. In this new era of warfare we cannot neglect the weapons for our men, and by designing better weapons, we will make better soldiers"
  AXIS_construction_developments:0 "Construction Developments"
  AXIS_construction_developments_desc:0 "There's much to be done in our alliance, and little time before the hour of doom comes. We will have to work together to find the improvements we need to get up to speed in the development of our nations"
  AXIS_industry:0 "Industrial Development"
  AXIS_industry_desc:0 "With or without war, our nations must build the infrastructure and capital needed to support our civilian population and improve their quality of life. Of course, once the wartime hits, it will be a vital bedrock of our war economy"
  AXIS_civilian_contributions:0 "Civilian Contributions"
  AXIS_civilian_contributions_desc:0 "Now that the general population has a new sense of shared identity with the other members of our alliance, we know they will be willing to make the contributions and sacrifices needed to fuel the war machine that will bring safety and glory to our alliance"
  AXIS_fill_the_infrastructure_gaps:0 "Fill The Infrastructure Gaps"
  AXIS_fill_the_infrastructure_gaps_desc:0 "Before joining together, our countries were at different levels of development, and even some of the regions in the most developed countries in our alliance could use some better infrastructure. We must pull together to raise all boats"
  AXIS_develop_resources:0 "Develop Resources"
  AXIS_develop_resources_desc:0 "You never know what you might find if you look hard enough. If we focus our efforts we could unearth undiscovered deposits of resources crucial to the war effort, and even develop new ways to extract more out of what we already have"
  AXIS_naval_construction:0 "Naval Construction"
  AXIS_naval_construction_desc:0 "Having a long tradition of seafaring and world class sailors is all well and good, but it means nothing if we don't have the ships to use them against our enemies. Let us build up a grand fleet together, and use it to crush any country that threaten us"
  AXIS_railway_expansion:0 "Railway Expansion"
  AXIS_railway_expansion_desc:0 "Railways are the arteries of our nations, and now more than ever we need these lanes of transportation as widespread as possible. Now that we are united in objective, we must be physically united through the steel and speed of the locomotives"
  AXIS_electronics:0 "New Electronics"
  AXIS_electronics_desc:0 "Electronics are here, and they could become the deciding factor of warfare in the future, we cannot let our enemy beat us to the punch in the electronics arms race. Let us develop these electronics together so this new power lays on our side"
  AXIS_research_investments:0 "Joint Research Investments"
  AXIS_research_investments_desc:0 "Our new alliance is tighter than any other, there's no reason why we should keep our technological advancements to ourselves. Let us share our research so our tools of warfare have the edge they need to cut our enemies down"
  AXIS_nuclear_research:0 "Nuclear Research"
  AXIS_nuclear_research_desc:0 "Scientists cannot keep their mouths shut about the new world that is bound to land upon us when the splitting of the atom is finally weaponized. Why should we be kept from this technological miracle that could bring and end to the war in one fell swoop"
  AXIS_nuclear_production:0 "Nuclear Production"
  AXIS_nuclear_production_desc:0 "Now that we have the knowledge to split the atom, we may as well use it. But first, we need to produce the materials and infrastructure needed to produce enough to turn the tides of war in our favor"
  AXIS_rocketry:0 "Rocketry"
  AXIS_rocketry_desc:0 "What if our bombs could be delivered without the intervention of a plane? Self propelled weapons are the future, we could decimate the enemy from the comfort of our homes if we so wish"
  AXIS_jet_engines:0 "Into The Jet Age"
  AXIS_jet_engines_desc:0 "New advancements in jet engines make the top of the class propeller aircraft look like paper kites drifting aimlessly. The new age of aerial combat is here and will be dominated by the jet engine. If we pool our investments into the field together, we can leapfrog our enemies and produce the top of the aircraft food chain."
  AXIS_military_industry:0 "Military Buildup"
  AXIS_military_industry_desc:0 "The Military Buildup Program will be established to ensure that our war machine is always supplied with the cogs it needs to function, and to defend our nations from terror and win any war necessary"
  AXIS_standarized_parts:0 "Standarized Parts"
  AXIS_standarized_parts_desc:0 "Now that we stand as one, we can benefit from sharing our standards with each other so our factories can get up to speed as quickly as possible. Equipment and parts could become interchangeable, streamlining our production considerably"
  AXIS_military_industry_hub:0 "Military Industry Hubs"
  AXIS_military_industry_hub_desc:0 "By concentrating our military industries in an efficient way, we can use this proximity and specialization to achieve new heights for our war machines. We shall outproduce our enemies, as long as we keep our factories in place"
  AXIS_ad_hoc_military_industry:0 "Ad-Hoc Military Industry"
  AXIS_ad_hoc_military_industry_desc:0 "There is no time to plan and build monumental factory campuses, or expanses of concrete and smoke. We must build our industry as quickly as we can, wherever possible, with small factories dotted around so we don't risk losing it all in one battle"
  AXIS_equipment_conversion_focus:0 "Efficient Equipment Conversion"
  AXIS_equipment_conversion_focus_desc:0 "We have vast warehouses filled with old weapons and vehicles, either mothballed or captured from our fallen enemies. This old equipment can be refitted into the newest and most deadly our current war machine offers"
  AXIS_machine_tools_research:0 "Machine Tools Research"
  AXIS_machine_tools_research_desc:0 "Manpower is just one part of the equation. We need to outproduce our enemies so we can replace the losses that they cannot. This is why we cannot limit ourselves to developing new war machines, but focus our attention on the machinery that spawns them"
  AXIS_army:0 "Land Operations Department"
  AXIS_army_desc:0 "Regardless of the nation they come from, all soldiers are part of our alliance, and will march until our enemies is eradicated, by our combined strength and implacable will"
  AXIS_joint_military_exercises:0 "Joint Military Exercises"
  AXIS_joint_military_exercises_desc:0 "Our soldiers and officers have never encountered an alliance like the one we are now in, they must be drilled as one until working together becomes second nature. Once this happens, our forces will be unstoppabl."
  AXIS_unified_recruitment:0 "Unified Recruitent"
  AXIS_unified_recruitment_desc:0 "We must find a way to standardize our recruitment efforts, and streamline the process so we can get more of our men can get from the recruitment office to the front as quickly as possible"
  AXIS_mechanized_army:0 "Mechanized Army"
  AXIS_mechanized_army_desc:0 "If we focus our efforts in training our men to fight inside and alongside hulking vehicles clad in steel and cannons, we can pack a bigger punch with less men. As long as we can produce enough of said hulks, of course"
  AXIS_infantry_first:0 "Infantry First"
  AXIS_infantry_first_desc:0 "For generations our men have gone into the battlefield with just their weapons and the garments on them, to fight tooth and nail for every inch against another poor soul in front of them. If our troops can see the eyes of the enemy in front of them, they will see the threat they pose and fight until the death for their nations"
  AXIS_navy:0 "Naval Coordination Command"
  AXIS_navy_desc:0 "The combined navies of the alliance will rule the waves across all our dominions. We will be a tide that will pound our enemies until all that's left is their shipwrecks"
  AXIS_naval_exercises:0 "Naval Exercises"
  AXIS_naval_exercises_desc:0 "As any seafaring nations knows, the sea can be both a moat and a highway at the same time. Let us learn how to defend and attack from the sea"
  AXIS_naval_officer_academy:0 "Naval Officer Academy"
  AXIS_naval_officer_academy_desc:0 "A good officer matters in naval warfare more than in most other forms of combat. There's not much than a single sailor can do without coordination from the hierarchy of officers that staff the ships and taskforces of our navies. Investing in training these men for making difficult choices and working together is of the utmost importance"
  AXIS_construct_new_dockyards:0 "Construct New Dockyards"
  AXIS_construct_new_dockyards_desc:0 "Our goal of having the biggest navy is slowed down by our amount of dockyards. We need more of them if we want our combined navy to dominate all seas"
  AXIS_naval_research_institute:0 "Naval Research Institute"
  AXIS_naval_research_institute_desc:0 "It will not be enough for us to catch up to our enemies, we need to be at the forefront of Naval technology, like we've been before. Let's embrace our region's legacy of exploration and naval dominance"
  AXIS_submarine_cooperation:0 "Submarine Cooperation"
  AXIS_submarine_cooperation_desc:0 "By denying the enemy the ability to transport troops and supply by the sea, we have already half won the war. The best way to ensure this is to work jointly on producing state of the art submarines"
  AXIS_mountaineers:0 "Mountain Specialists"
  AXIS_mountaineers_desc:0 "With a strong cadre of mountain specialists, we should be able to defend the region much more easily, and make it possible to counterattack whenever we have the chance. Even if part of our territory falls into enemy hands, we shall never surrender"
  AXIS_amphibious_forces:0 "Amphibious Forces"
  AXIS_amphibious_forces_desc:0 "By ensuring that we can strike our enemies anywhere, anytime, we can reduce their offensive capabilities. If they always have to fear a landing, anywhere along their coastline, they can't deploy as much units on the front line. Thus our focus need to be on amphibious operations and marines"
  AXIS_airforce:0 "Air Defense Program"
  AXIS_airforce_desc:0 "If we develop our aerial capabilities, we will better direct our strength. We will make our foes bow down before the might of our combined air forces"
  AXIS_air_exercises:0 "Air Exercises"
  AXIS_air_exercises_desc:0 "As air combat brought a new era of war, this new era of cooperation between our nations must be accompanied by tightly executed joint aerial operations. For that, our forces need drill together until they fly as one"
  AXIS_air_production:0 "Air Production"
  AXIS_air_production_desc:0 "If we hope to establish supremacy across the world, we need to produce as much aircrafts as possible. Thankfully, we can share the practices, knowledge and equipment we can use to outproduce the enemy and get closer to our goals"
  AXIS_naval_aircraft:0 "Naval Aircraft"
  AXIS_naval_aircraft_desc:0 "The future of sea warfare lies in the skies. Our naval bombers will send the ships of our enemies to the bottom of the sea, and from our carriers fighters swarms of fighters will cover the skies with the smoke of our enemy's aircraft"
  AXIS_bomber_command:0 "Bomber Command"
  AXIS_bomber_command_desc:0 "Establishing a joint bomber command will allow us to better coordinate our ground support in the battlefield, and our bomber incursions behind enemy lines."
  AXIS_fighter_command:0 "Fighter Command"
  AXIS_fighter_command_desc:0 "The same way we share our ideals and overarching mission, we share the skies above us. We must fly together to protect each other's airspace, and gain air supremacy over the battlefield so our ties are not broken by our enemy's ground support"
  AXIS_ground_operations:0 "Ground Operations"
  AXIS_ground_operations_desc:0 "Building more bases, allows us to have more flexibility in our joint air operations, and building more anti-air batteries we can defend our land and take some weight out of our pilot's backs. This is how we create an interlinked ground support system to maximize the effectiveness of our air operations"
  AXIS_carrier_effort:0 "Carrier Effort"
  AXIS_carrier_effort_desc:0 "The new frontier of naval combat are the skies above them. We need to pool our resources into creating the best carriers, and the best carrier aircraft possible. That way we can dominate the seas, and by doing that, create the security that our countries require"
  COMINTERN_political_cooperation:0 "Political Cooperation"
  COMINTERN_political_cooperation_desc:0 "Lip service will not be enough to truly work together. If we really want to become a force to be reckoned with, we need all of our systems to be cogs of a larger, well oiled machine"
