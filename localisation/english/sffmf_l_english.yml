  #National Focuses
  AXIS_create_axis_command:0 "Create Joint Axis Command"
  AXIS_create_axis_command_desc:0 "To unite whole Europe under our command we need closer cooperation with those who share our worldview"
  AXIS_first_joint_institution:0 "Axis War Research Institute"
  AXIS_first_joint_institution_desc:0 "Closer cooperation with our allies will bring a breakthrough in new war technology"
  AXIS_second_institution:0 "Axis War Production Committee"
  AXIS_second_institution_desc:0 "As war time is closing upon us, we need our countries to cooperate in production of new war equipment"
  AXIS_research:0 "Axis Joint Research Group"
  AXIS_research_desc:0 "Our joint research group will be developing the latest means of destruction, and mass produce the best tools we can so that win all wars and become masters of Europe"
  AXIS_command:0 "Axis Joint Army High Command"
  AXIS_command_desc:0 "Uniting our High Commands will bring the best results and ensure any war will be won by us as quickly and smoothly as possible"
